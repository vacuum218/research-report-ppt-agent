[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-report-ppt-agent"
version = "0.2.0"
description = "Generate structured PowerPoint assets from financial research reports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-pptx==0.6.23",
  "jsonschema>=4.18,<5",
  "lxml>=4.9,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=7,<9",
]

[project.scripts]
research-report-ppt = "research_report_ppt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/research-report-ppt/schemas" = [
  "schemas/parsed_document.schema.json",
  "schemas/slide_outline.schema.json",
  "schemas/visualization.schema.json",
]
"share/research-report-ppt/prompts" = [
  "prompts/outline_system_prompt.md",
  "prompts/outline_few_shot_examples.json",
]
"share/research-report-ppt/templates" = [
  "templates/financial_report_template_v1.pptx",
  "templates/template_layout_map.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
